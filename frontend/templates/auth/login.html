{% extends "base.html" %}

{% block title %}Sign In{% endblock %}

{% block content %}
<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #ffffff;">
  <div class="card" style="width: 100%; max-width: 440px; padding: 2.5rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <img src="{{ url_for('static', filename='images/logo.png') }}" alt="ProjectPartner Logo" style="height: 55px; width: auto; object-fit: contain; margin-bottom: 0.75rem;">
      <h2 style="font-size: 1.5rem; font-weight: 800; color: var(--brand-navy);">Student Sign In</h2>
      <p style="font-size: 0.85rem; color: var(--text-muted);">Access your student project workspace & mentor</p>
    </div>

    <form method="POST" action="{{ url_for('auth.login') }}">
      <div class="form-group">
        <label class="form-label">College Email Address</label>
        <input type="email" name="email" class="form-control" placeholder="student@college.edu" required>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; margin-top: 1rem;">
        Sign In to Workspace <i class="bi bi-arrow-right"></i>
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-secondary);">
      Don't have an account yet? <a href="{{ url_for('auth.register') }}" style="font-weight: 700;">Register Student Account</a>
    </div>
  </div>
</div>
{% endblock %}
