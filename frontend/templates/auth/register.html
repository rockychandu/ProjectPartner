{% extends "base.html" %}

{% block title %}Create Student Account{% endblock %}

{% block content %}
<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #ffffff; padding: 2.5rem 0;">
  <div class="card" style="width: 100%; max-width: 520px; padding: 2.5rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <img src="{{ url_for('static', filename='images/logo.png') }}" alt="ProjectPartner Logo" style="height: 55px; width: auto; object-fit: contain; margin-bottom: 0.75rem;">
      <h2 style="font-size: 1.5rem; font-weight: 800; color: var(--brand-navy);">Student Registration</h2>
      <p style="font-size: 0.85rem; color: var(--text-muted);">Create your account to discover & build student-owned projects</p>
    </div>

    <form method="POST" action="{{ url_for('auth.register') }}">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input type="text" name="name" class="form-control" placeholder="Alex Rivers" required>
      </div>

      <div class="form-group">
        <label class="form-label">College Email</label>
        <input type="email" name="email" class="form-control" placeholder="alex@university.edu" required>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">College / University</label>
          <input type="text" name="college" class="form-control" placeholder="Institute of Technology">
        </div>
        <div class="form-group">
          <label class="form-label">Branch / Major</label>
          <input type="text" name="branch" class="form-control" placeholder="Computer Science">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Academic Year</label>
        <select name="year" class="form-control">
          <option value="1st Year">1st Year</option>
          <option value="2nd Year">2nd Year</option>
          <option value="3rd Year" selected>3rd Year</option>
          <option value="4th Year">4th Year (Senior)</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; margin-top: 1rem;">
        Register Account & Setup Profile <i class="bi bi-arrow-right"></i>
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-secondary);">
      Already registered? <a href="{{ url_for('auth.login') }}" style="font-weight: 700;">Sign In</a>
    </div>
  </div>
</div>
{% endblock %}
